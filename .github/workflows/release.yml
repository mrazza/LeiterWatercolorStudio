name: Release Executables

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
          - rid: win-arm64
            os: windows-latest
            archive_ext: zip
          - rid: osx-x64
            os: macos-latest
            archive_ext: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive_ext: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${TAG#v}"
          if [[ "$CLEAN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version_arg=-p:Version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Self-Contained Executable
        run: >
          dotnet publish src/LeiterWatercolorStudio.App/LeiterWatercolorStudio.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          ${{ steps.version.outputs.version_arg }}
          --output publish/${{ matrix.rid }}

      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          chmod +x publish/${{ matrix.rid }}/LeiterWatercolorStudio
          tar -czf artifacts/LeiterWatercolorStudio-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath artifacts/LeiterWatercolorStudio-${{ matrix.rid }}.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeiterWatercolorStudio-${{ matrix.rid }}
          path: artifacts/LeiterWatercolorStudio-${{ matrix.rid }}.${{ matrix.archive_ext }}

      - name: Upload Release Asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "artifacts/LeiterWatercolorStudio-${{ matrix.rid }}.${{ matrix.archive_ext }}" \
            --clobber
