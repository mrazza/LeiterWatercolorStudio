name: Build & Test

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore LeiterWatercolorStudio.slnx

      - name: Build Solution
        run: dotnet build LeiterWatercolorStudio.slnx --configuration Release --no-restore

      - name: Run Core Tests
        run: dotnet test tests/LeiterWatercolorStudio.Core.Tests/LeiterWatercolorStudio.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Run App Tests
        run: dotnet test tests/LeiterWatercolorStudio.App.Tests/LeiterWatercolorStudio.App.Tests.csproj --configuration Release --no-build --verbosity normal
